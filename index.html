<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="weather-card">
            <!-- top heading  -->
             <h1>Weather updates</h1>

            <!-- Search Section -->
            <div class="search-box">
                <div class="input-box">
                    <input type="text" id="city" class="city-input" placeholder="Enter city name" required>
                    
                </div>

                <button class="search-btn">
                    🔍
                </button>
            </div>

            <!-- Weather Icon -->
            <div class="weather-image">
                
               

                
            </div>

            <!-- Temperature -->
            <h2>Temperature</h2>
            <div class="temperature">
                 <img src="images/temperature.png" alt="" width="120px" height="120px"> 
                <span></span>
            </div>


            <!-- City Name -- -->
            
            
            <div class="city-name">
            
                <h1></h1>
            </div>

            <!-- Weather Description -->
            <div class="description">
                <p></p>
            </div>

            <!-- Weather Details -->
            <div class="details">

                <div class="detail-box humidity">
                    <h3>💧</h3>
                    <p>Humidity</p>
                    <span></span>
                </div>

                <div class="detail-box wind">
                    <h3>🌬</h3>
                    <p>Wind</p>
                    <span></span>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
